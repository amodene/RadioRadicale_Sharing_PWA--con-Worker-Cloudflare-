<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portale Applicazioni Web</title>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --text: #f5f5f5;
      --accent: #2196f3;
      --border: #2c2c2c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
    }
    header { text-align: center; margin-bottom: 30px; }
    h1 { font-size: 1.5rem; margin-bottom: 8px; }
    p { color: #888; font-size: 0.9rem; }
    .nav-grid {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .card:active { transform: scale(0.98); }
    .card h2 { font-size: 1.1rem; color: #fff; }
    .card p { font-size: 0.85rem; color: #aaa; }
    .badge {
      display: inline-block;
      align-self: flex-start;
      background: #d32f2f;
      color: #fff;
      font-size: 0.7rem;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Web Applications Hub</h1>
    <p>Seleziona un'applicazione per iniziare</p>
  </header>

  <nav class="nav-grid">
    <a href="radio-radicale/" class="card">
      <span class="badge">PWA</span>
      <h2>Radio Radicale - Riascolta</h2>
      <p>Palinsesto quotidiano, ricerca trasmissioni e generatore link condivisibili con minutaggio.</p>
    </a>

    <a href="altro-progetto/" class="card">
      <h2>Altro Progetto</h2>
      <p>Applicazione indipendente slegata dalla PWA.</p>
    </a>
  </nav>
</body>
</html>
